
name: Build AUREX Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack AUREX source archive
        run: |
          unzip AUREX_Flutter_MVP_Source.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: source/aurex_flutter
        run: flutter create --platforms=android --org com.aurex .

      - name: Install dependencies
        working-directory: source/aurex_flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: source/aurex_flutter
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurex-android-apk
          path: source/aurex_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
